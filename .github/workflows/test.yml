name: Tests

on:
  # Run on push to any branch
  push:
    branches:
      - '**'
  # Run on pull request events
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.9'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.2
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_DATABASE: communityrapidresponse_test
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Wait for MariaDB
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u root -ptestroot --silent 2>/dev/null; then
              echo "MariaDB is ready"
              break
            fi
            echo "Waiting for MariaDB... ($i/30)"
            sleep 2
          done

      - name: Run migrations
        run: |
          for migration in migrations/*.up.sql; do
            echo "Running migration: $migration"
            mysql -h 127.0.0.1 -u root -ptestroot communityrapidresponse_test < "$migration"
          done

      - name: Install dependencies
        run: go mod download

      - name: Run unit tests
        run: go test ./internal/config/... ./internal/middleware/... ./internal/models/... -v

      - name: Run service tests
        run: go test ./internal/services/... -v

      - name: Run database tests
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_USER: root
          TEST_DB_PASSWORD: testroot
          TEST_DB_NAME: communityrapidresponse_test
        run: go test ./internal/database/... -v

      - name: Run handler tests
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_USER: root
          TEST_DB_PASSWORD: testroot
          TEST_DB_NAME: communityrapidresponse_test
        run: go test ./internal/handlers/... -v

      - name: Run integration tests
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_USER: root
          TEST_DB_PASSWORD: testroot
          TEST_DB_NAME: communityrapidresponse_test
        run: go test ./tests/... -v -run Integration

      - name: Run E2E tests
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_USER: root
          TEST_DB_PASSWORD: testroot
          TEST_DB_NAME: communityrapidresponse_test
        run: go test ./tests/... -v -run E2E

      - name: Generate coverage report
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_USER: root
          TEST_DB_PASSWORD: testroot
          TEST_DB_NAME: communityrapidresponse_test
        run: go test ./internal/... -coverprofile=coverage.out -covermode=atomic -count=1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 14

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -o bin/server ./cmd/server

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: server-binary
          path: bin/server
          retention-days: 7

  security:
    name: Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        run: gosec -exclude=G117,G404,G704,G706 -exclude-dir=tests ./...

  doc-drift:
    name: Doc Drift
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check documentation against router and migrations
        run: go run ./cmd/doc-drift
