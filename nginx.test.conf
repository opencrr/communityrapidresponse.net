# Community Rapid Response - Nginx Configuration for Test Environment
# Proxies API requests to the test Go backend (app-test container)

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript image/svg+xml;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index templates/index.html;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Content-Security-Policy mirrors the Go server's policy. Keep in sync with
        # cmd/server/main.go. NOTE: locations that declare their own add_header
        # (e.g. "/" below) must re-declare these, since nginx add_header does not
        # merge across levels.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://api.mapbox.com; style-src 'self' https://api.mapbox.com 'unsafe-inline'; img-src 'self' data: blob: https://api.mapbox.com; connect-src 'self' https://api.mapbox.com https://events.mapbox.com; worker-src blob:; child-src blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

        # Proxy API requests to Go test backend
        location /api/ {
            proxy_pass http://app-test:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Proxy health endpoint
        location = /health {
            proxy_pass http://app-test:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Serve static files with two-tier caching:
        # - URLs with ?v= query param get immutable caching (entry-point assets)
        # - URLs without ?v= get no-cache for ETag revalidation (JS modules)
        location /static/ {
            alias /usr/share/nginx/html/static/;
            etag on;

            if ($args ~* "v=") {
                add_header Cache-Control "public, max-age=31536000, immutable" always;
            }
            if ($args !~* "v=") {
                add_header Cache-Control "no-cache" always;
            }
        }

        # Serve templates
        location /templates/ {
            alias /usr/share/nginx/html/templates/;
        }

        # Favicon and other root files
        location ~* ^/(favicon\.ico|robots\.txt|sitemap\.xml)$ {
            try_files $uri =404;
        }

        # SPA fallback - serve index.html for all non-file routes
        # no-cache ensures users always get the latest entry point
        location / {
            try_files $uri $uri/ /templates/index.html;
            add_header Cache-Control "no-cache" always;
            # Re-declared because this location's own add_header suppresses the
            # server-level security headers (nginx does not merge add_header).
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://api.mapbox.com; style-src 'self' https://api.mapbox.com 'unsafe-inline'; img-src 'self' data: blob: https://api.mapbox.com; connect-src 'self' https://api.mapbox.com https://events.mapbox.com; worker-src blob:; child-src blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
        }

        # Deny access to sensitive files
        location ~* \.(md|sql|env|bak|config)$ {
            deny all;
        }
    }
}
